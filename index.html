<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Remind.me</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#04060c"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#04060c;--card:#0c1220;--ink:#eaf1ff;--mute:#7b88a6;--line:#18233d;--acc:#2f6bff;--acc2:#00a3ff;--accs:#0f1d3d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#04060c;--card:#0c1220;--ink:#eaf1ff;--mute:#7b88a6;--line:#18233d;--acc:#2f6bff;--acc2:#00a3ff;--accs:#0f1d3d}}
:root[data-theme="dark"]{--bg:#04060c;--card:#0c1220;--ink:#eaf1ff;--mute:#7b88a6;--line:#18233d;--acc:#2f6bff;--acc2:#00a3ff;--accs:#0f1d3d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:32px 20px 60px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;gap:12px;flex-wrap:wrap}
h1{font:500 30px Fraunces,Georgia,serif;margin:0;letter-spacing:-.5px}
h1 span{color:var(--acc)}
.pill{border:1px solid var(--line);background:var(--card);color:var(--mute);border-radius:99px;padding:6px 14px;font:inherit;font-size:13px;cursor:pointer}
.pill:hover{color:var(--acc);border-color:var(--acc)}
nav{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:24px}
nav button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 16px;font:inherit;color:var(--mute);cursor:pointer;margin-bottom:-1px}
nav button.on{color:var(--ink);border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.grid{grid-template-columns:1fr}}
label{display:block;font-size:12px;color:var(--mute);margin-bottom:4px}
input,select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ink);font:inherit;outline:none}
input:focus,select:focus{border-color:var(--acc)}
.full{grid-column:1/-1}
.row{display:flex;gap:8px;align-items:flex-end}
.btn{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border:0;border-radius:10px;padding:11px 20px;font:inherit;font-weight:500;cursor:pointer}
.btn:hover{opacity:.9}
.ghost{background:var(--accs);color:var(--acc)}
.item{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line)}
.item:last-child{border:0}
.item .t{flex:1;min-width:0}
.item .t b{font-weight:500;display:block;overflow-wrap:anywhere}
.item .t small{color:var(--mute);font-size:12.5px}
.x{background:none;border:0;color:var(--mute);cursor:pointer;font-size:18px;padding:4px 8px}
.x:hover{color:var(--acc)}
.dim{opacity:.45}
h3{font:500 13px Inter;text-transform:uppercase;letter-spacing:1px;color:var(--mute);margin:26px 0 4px}
.empty{color:var(--mute);text-align:center;padding:28px 0}
.cal-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.cal-h b{font:500 20px Fraunces,Georgia,serif}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .d{font-size:11px;color:var(--mute);padding:4px}
.cal button{aspect-ratio:1;background:none;border:1px solid transparent;border-radius:12px;color:var(--ink);font:inherit;cursor:pointer;position:relative}
.cal button:hover{background:var(--accs)}
.cal button.today{border-color:var(--acc)}
.cal button.sel{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;transform:scale(1.08)}
.cal button i{position:absolute;bottom:6px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--acc)}
.cal button.sel i{background:#fff}
.chk{width:20px;height:20px;accent-color:var(--acc);flex:none}
.done b{text-decoration:line-through;color:var(--mute)}
#toasts{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));right:16px;display:flex;flex-direction:column;gap:10px;z-index:9}
.toast{background:var(--card);border:1px solid var(--acc);border-radius:14px;padding:14px 16px;min-width:240px;max-width:320px;box-shadow:0 8px 30px rgba(0,0,0,.15);display:flex;gap:12px;align-items:flex-start}
.toast b{display:block;font-weight:500}.toast small{color:var(--mute)}

body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 15% 10%,color-mix(in srgb,var(--acc) 22%,transparent),transparent 40%),radial-gradient(circle at 85% 30%,color-mix(in srgb,var(--acc2) 18%,transparent),transparent 40%);animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(-3%,4%) scale(1.15)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:translateX(40px) scale(.9)}70%{transform:translateX(-4px) scale(1.02)}100%{opacity:1;transform:none}}
@keyframes flow{50%{background-position:100% 50%}}
@keyframes word{from{opacity:0;transform:translateY(18px) scale(.9);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes wig{0%,100%{transform:rotate(0)}20%{transform:rotate(-18deg)}40%{transform:rotate(14deg)}60%{transform:rotate(-8deg)}}
@keyframes bar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
h1{font-weight:500;font-size:32px}
h1 span{background:linear-gradient(135deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent;font-style:italic}
h1::after{content:"🔔";font-size:18px;margin-left:8px;display:inline-block;animation:wig 3s ease-in-out 1s infinite;transform-origin:top center}
.card{animation:rise .6s both;box-shadow:0 10px 30px -18px var(--acc)}
section>*{animation:rise .5s both}
.item{animation:rise .45s both}
.item:nth-child(2){animation-delay:.05s}.item:nth-child(3){animation-delay:.1s}.item:nth-child(4){animation-delay:.15s}
.btn,.pill,.cal button,nav button,.x{transition:transform .2s,box-shadow .2s,background .2s,color .2s,border-color .25s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 18px -6px var(--acc);opacity:1}
.btn:active,.pill:active{transform:scale(.94)}
.pill:hover{transform:translateY(-1px)}
.cal button:hover{transform:scale(1.12)}
.cal button i{animation:pulse 1.6s infinite}
@keyframes pulse{50%{transform:scale(1.8);opacity:.5}}
.toast{animation:pop .5s both;border-width:2px}
.x:hover{transform:rotate(90deg)}
.chk{transition:transform .2s}.chk:checked{transform:scale(1.2)}
nav button.on{font-weight:500;color:var(--acc)}
#splash{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:32px;text-align:center;color:#fff;background:linear-gradient(120deg,#000000,#0a2a8f,#1f6bff,#000000);background-size:300% 300%;animation:flow 8s ease infinite;transition:opacity .7s,transform .7s}
#splash.hide{opacity:0;transform:scale(1.06);pointer-events:none}
#splash .mark{font:500 18px Fraunces,Georgia,serif;letter-spacing:1px;opacity:.85;animation:rise .8s both}
#qt{font:500 clamp(26px,5vw,44px)/1.25 Fraunces,Georgia,serif;max-width:720px;margin:0}
#qt span{display:inline-block;animation:word .7s both}
#splash .btn{background:#fff;color:var(--acc);animation:rise .8s 3.4s both}
#splash .bar{position:absolute;left:0;bottom:0;height:5px;width:100%;background:#fff;transform-origin:left;animation:bar 8.5s linear both}
footer{margin-top:48px;text-align:center;font-size:12px;letter-spacing:2.5px;color:var(--mute);animation:rise .8s .6s both}
footer b{background:linear-gradient(135deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:500}
@media(prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}

#splash{overflow:hidden;gap:20px}
#splash>*{position:relative;z-index:2}
#splash .orbs{position:absolute;inset:-20%;z-index:0;background:radial-gradient(circle at 30% 30%,rgba(47,107,255,.55),transparent 35%),radial-gradient(circle at 70% 70%,rgba(0,163,255,.4),transparent 35%);animation:orb 9s ease-in-out infinite alternate}
@keyframes orb{to{transform:translate(6%,-6%) rotate(20deg) scale(1.2)}}
.ring{position:absolute!important;left:50%;top:50%;width:140px;height:140px;margin:-70px 0 0 -70px;border:2px solid rgba(90,165,255,.75);border-radius:50%;z-index:1!important;opacity:0;animation:ripple 3.6s ease-out infinite}
.r2{animation-delay:1.2s}.r3{animation-delay:2.4s}
@keyframes ripple{0%{transform:scale(.3);opacity:.9}100%{transform:scale(9);opacity:0}}
.bell{font-size:56px;transform-origin:top center;filter:drop-shadow(0 0 18px #2f6bff);animation:drop .8s both,wig 1.4s .9s ease-in-out 3}
.logo{font:600 clamp(46px,11vw,96px)/1 Fraunces,Georgia,serif;letter-spacing:-1px;text-shadow:0 0 40px rgba(47,107,255,.9)}
.logo span{display:inline-block;animation:drop .8s cubic-bezier(.2,1.4,.4,1) both}
.logo .m{background:linear-gradient(135deg,#8cc2ff,#2f6bff,#00d0ff);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}
@keyframes drop{from{opacity:0;transform:translateY(-60px) scale(.5) rotate(-12deg);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
.pt{position:absolute!important;bottom:-10px;border-radius:50%;background:#5aa2ff;box-shadow:0 0 10px #2f6bff;opacity:0;animation:fl linear infinite;z-index:1!important}
@keyframes fl{0%{transform:translateY(0);opacity:0}10%{opacity:.9}100%{transform:translateY(-110vh);opacity:0}}

h1 span{background:none;-webkit-background-clip:initial;background-clip:initial;color:inherit;font-style:normal}
h1::after{content:none}
.logo .m{background:none;-webkit-background-clip:initial;background-clip:initial;color:#3b82ff;text-shadow:0 0 30px rgba(59,130,255,.9)}
h1 span{color:#3b82ff}
#toasts{z-index:60}
#mod{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.65);backdrop-filter:blur(6px);animation:fade .25s both}
#mod[hidden]{display:none}
@keyframes fade{from{opacity:0}}
#mod .box{background:var(--card);border:1px solid var(--acc);border-radius:20px;padding:22px;width:min(440px,100%);max-height:100%;overflow:auto;box-shadow:0 20px 60px -10px var(--acc);animation:pop2 .4s cubic-bezier(.2,1.3,.4,1) both}
@keyframes pop2{from{opacity:0;transform:translateY(30px) scale(.92)}}
.mh{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px}
.mh small{color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:1px;display:block}
.mh b{font:500 20px Fraunces,Georgia,serif}
</style></head>
<body><div id="splash"><div class="orbs"></div><div class="ring"></div><div class="ring r2"></div><div class="ring r3"></div><div class="logo" id="logo"></div><p id="qt"></p><button class="btn" id="go">Let's go →</button><div class="bar"></div></div><div class="wrap">
<header><h1>Remind<span>.me</span></h1>
<div style="display:flex;gap:8px"><button class="pill" id="perm">Enable desktop alerts</button><button class="pill" id="test">Test</button></div></header>
<nav id="nav"><button data-v="rem" class="on">Reminders</button><button data-v="cal">Calendar</button><button data-v="todo">To-do</button></nav>

<section id="rem">
<div class="card"><div class="grid">
<div class="full"><label>Remind me to</label><input id="txt" placeholder="e.g. Submit assignment" maxlength="120"></div>
<div><label>Day</label><input id="date" type="date"></div>
<div><label>Time</label><input id="time" type="time"></div>
<div><label>Repeat</label><select id="rep"><option value="once">Once</option><option value="daily">Every day</option><option value="weekly">Every week</option><option value="monthly">Every month</option></select></div>
<div><label>Notify me before</label><select id="lead"><option value="0">At the time</option><option value="5">5 minutes</option><option value="10">10 minutes</option><option value="15">15 minutes</option><option value="30">30 minutes</option><option value="60">1 hour</option><option value="180">3 hours</option><option value="1440">1 day</option><option value="10080">1 week</option></select></div>
<div class="full row"><div style="flex:1"><label>Sound</label><select id="snd"></select></div><button class="pill" id="prev" style="height:42px">▶ Preview</button><button class="btn" id="add" style="height:42px">Add</button></div>
</div></div>
<div id="list"></div>
</section>

<section id="cal" hidden>
<div class="card"><div class="cal-h"><button class="pill" id="pm">‹</button><b id="mt"></b><button class="pill" id="nm">›</button></div><div class="cal" id="grid"></div></div>
<h3 id="dl"></h3><div id="dlist"></div>
</section>

<section id="todo" hidden>
<div class="card"><div class="row"><div style="flex:1"><input id="tt" placeholder="Add a task…" maxlength="120"></div><button class="btn" id="ta" style="height:42px">Add</button></div></div>
<div id="tl" style="margin-top:8px"></div>
</section>
<footer>Build by <b>UJJWAL GUPTA</b></footer>
</div>
<div id="mod" hidden><div class="box"><div class="mh"><div><small>New event</small><b id="mdate"></b></div><button class="x" id="mx">×</button></div>
<div class="grid"><div class="full"><label>What to remind</label><input id="mtxt" placeholder="e.g. Maths exam" maxlength="120"></div>
<div><label>Time</label><input id="mtime" type="time"></div>
<div><label>Repeat</label><select id="mrep"><option value="once">Once</option><option value="daily">Every day</option><option value="weekly">Every week</option><option value="monthly">Every month</option></select></div>
<div><label>Notify me before</label><select id="mlead"><option value="0">At the time</option><option value="5">5 minutes</option><option value="10">10 minutes</option><option value="15">15 minutes</option><option value="30">30 minutes</option><option value="60">1 hour</option><option value="180">3 hours</option><option value="1440">1 day</option><option value="10080">1 week</option></select></div>
<div><label>Sound</label><div class="row"><select id="msnd"></select><button class="pill" id="mprev" style="height:42px">▶</button></div></div>
<div class="full row" style="justify-content:flex-end"><button class="pill" id="mcancel" style="height:42px">Cancel</button><button class="btn" id="msave" style="height:42px">Save event</button></div></div></div></div>
<div id="toasts"></div>

<script>
const $=s=>document.querySelector(s),GR=30*6e4;
const SND={Chime:[[784,0,.5,'sine'],[1047,.15,.8,'sine']],Bell:[[880,0,1.4,'triangle'],[1760,0,.8,'sine']],Soft:[[523,0,.6,'sine'],[659,.2,.6,'sine'],[784,.4,.9,'sine']],Pulse:[[660,0,.15,'square'],[660,.25,.15,'square'],[660,.5,.15,'square']],Beep:[[1000,0,.2,'sine'],[1000,.3,.2,'sine']]};
$('#snd').innerHTML=Object.keys(SND).map(k=>`<option>${k}</option>`).join('');
let S={rem:[],todo:[]},ac,sel=new Date(),cur=new Date();
try{S=Object.assign(S,JSON.parse(localStorage.getItem('hush')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('hush',JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fd=d=>d.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'}),ft=d=>d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
const same=(a,b)=>ymd(a)==ymd(b);

let act=[],rt=null;
function stopRing(){clearInterval(rt);rt=null;act.forEach(o=>{try{o.stop()}catch(e){}});act=[]}
function play(n,mode){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume();stopRing();const P=SND[n]||SND.Chime,per=Math.max(...P.map(x=>x[1]+x[2]))+.6;
const one=t=>P.forEach(([f,s,d,ty])=>{const st=t+s,o=ac.createOscillator(),g=ac.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(.0001,st);g.gain.exponentialRampToValueAtTime(ty=='square'?.08:.25,st+.02);g.gain.exponentialRampToValueAtTime(.0001,st+d);o.connect(g).connect(ac.destination);o.start(st);o.stop(st+d+.05);act.push(o);o.onended=()=>{act=act.filter(x=>x!==o)}});
const t0=ac.currentTime;one(t0);if(!mode)return;const lim=mode=='loop'?120:5;let next=t0+per;
rt=setInterval(()=>{if(ac.currentTime-t0>=lim){stopRing();return}while(next<ac.currentTime+3){one(next);next+=per}},250)}catch(e){}}
function adv(d,rep){d=new Date(d);if(rep=='daily')d.setDate(d.getDate()+1);else if(rep=='weekly')d.setDate(d.getDate()+7);else if(rep=='monthly')d.setMonth(d.getMonth()+1);else return null;return d}
function nxt(r){let o=new Date(r.at);while(o&&+o<=(r.last||0))o=adv(o,r.rep);return o}
function occ(r,a,b){const L=[];let o=new Date(r.at),n=0;while(o&&+o<b&&n++<3000){if(+o>=a)L.push(o);o=adv(o,r.rep)}return L}
const leadTxt=m=>m==0?'now':m<60?m+' min':m<1440?m/60+' hr':m<10080?m/1440+' day':'1 week';

function toast(r,o){const el=document.createElement('div');el.className='toast';const m=Math.round((+o-Date.now())/6e4);el.innerHTML=`<div style="flex:1"><b>${esc(r.text)}</b><small>${m>0?'in '+leadTxt(r.lead):'now'} · ${ft(o)}</small></div><button class="x" style="font-size:13px;color:var(--acc);white-space:nowrap;font-weight:500">■ Stop</button>`;el.querySelector('.x').onclick=()=>{el.remove();stopRing()};$('#toasts').append(el);setTimeout(()=>{el.remove();stopRing()},120000)}
function notify(t,o){if(!('Notification' in window)||Notification.permission!='granted')return;const f=()=>{try{new Notification(t,o)}catch(e){}};if('serviceWorker' in navigator&&navigator.serviceWorker.controller){navigator.serviceWorker.ready.then(r=>r.showNotification(t,o)).catch(f)}else f()}
try{if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
function fire(r,o){play(r.snd,'loop');toast(r,o);const m=Math.round((+o-Date.now())/6e4);notify(r.text,{body:(m>0?'In '+leadTxt(r.lead):'Now')+' · '+fd(o)+', '+ft(o),tag:r.id,requireInteraction:true,vibrate:[200,100,200],icon:'icon-192.png',silent:document.visibilityState=='visible'})}
function tick(){const now=Date.now();let ch=false;S.rem.forEach(r=>{let o=nxt(r);while(o&&now>+o+GR){r.last=+o;o=nxt(r);ch=true}if(o&&now>=+o-r.lead*6e4){fire(r,o);r.last=+o;ch=true}});if(ch){save();draw()}}

function drawRem(){const now=Date.now(),up=[],past=[];S.rem.forEach(r=>{const o=nxt(r);o?up.push([r,o]):past.push(r)});up.sort((a,b)=>a[1]-b[1]);
const row=(r,o,dim)=>`<div class="item ${dim?'dim':''}"><div class="t"><b>${esc(r.text)}</b><small>${fd(o)} · ${ft(o)} · ${r.rep=='once'?'once':'every '+r.rep.replace('ly','')} · ${r.lead?leadTxt(r.lead)+' before':'at the time'} · ♪ ${r.snd}</small></div><button class="x" data-del="${r.id}">×</button></div>`;
$('#list').innerHTML=(up.length?'<h3>Upcoming</h3>'+up.map(([r,o])=>row(r,o)).join(''):'<div class="empty">Nothing scheduled. Add your first reminder above.</div>')+(past.length?'<h3>Completed</h3>'+past.map(r=>row(r,new Date(r.at),1)).join(''):'')}
function drawCal(){const y=cur.getFullYear(),m=cur.getMonth(),first=new Date(y,m,1),days=new Date(y,m+1,0).getDate();$('#mt').textContent=cur.toLocaleDateString('en-IN',{month:'long',year:'numeric'});
const hit=new Set();S.rem.forEach(r=>occ(r,+first,+new Date(y,m+1,1)).forEach(o=>hit.add(o.getDate())));
let h='SMTWTFS'.split('').map(d=>`<div class="d">${d}</div>`).join('')+'<span></span>'.repeat(first.getDay());
for(let d=1;d<=days;d++){const dt=new Date(y,m,d);h+=`<button data-d="${d}" class="${same(dt,new Date())?'today ':''}${same(dt,sel)?'sel':''}">${d}${hit.has(d)?'<i></i>':''}</button>`}
$('#grid').innerHTML=h;
const a=new Date(sel.getFullYear(),sel.getMonth(),sel.getDate()),L=[];S.rem.forEach(r=>occ(r,+a,+a+864e5).forEach(o=>L.push([r,o])));L.sort((x,y)=>x[1]-y[1]);
$('#dl').textContent=fd(sel);$('#dlist').innerHTML=(L.length?L.map(([r,o])=>`<div class="item"><div class="t"><b>${esc(r.text)}</b><small>${ft(o)} · ♪ ${r.snd}</small></div></div>`).join(''):'<div class="empty">No reminders this day.</div>')+`<button class="pill" id="addhere" style="margin-top:8px">+ Add reminder on this day</button>`}
